<div class="auth-page">
  <section class="auth-view" aria-labelledby="register-title">
    <p class="eyebrow">Novi igrač</p>
    <h2 id="register-title">Registracija</h2>
    <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="submit()">
      <label>
        Ime
        <input type="text" formControlName="firstName" autocomplete="given-name" />
      </label>
      <label>
        Prezime
        <input type="text" formControlName="lastName" autocomplete="family-name" />
      </label>
      <label>
        Korisničko ime
        <input type="text" formControlName="username" autocomplete="username" />
      </label>
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <label>
        Lozinka
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>

      @if (registerForm.invalid && registerForm.touched) {
      <p class="form-message">Popuni sva polja. Korisničko ime mora imati 3, a lozinka 6 karaktera.</p>
      }

      @if (errorMessage()) {
      <p class="form-message">{{ errorMessage() }}</p>
      }

      <button class="solid-action large" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Kreiranje...' : 'Napravi nalog' }}
      </button>
    </form>
  </section>
</div>
