<div class="auth-page">
  <section class="auth-view" aria-labelledby="forgot-password-title">
    <p class="eyebrow">Oporavak naloga</p>
    <h2 id="forgot-password-title">Zaboravljena lozinka</h2>
    <form class="auth-form" [formGroup]="forgotPasswordForm" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      @if (forgotPasswordForm.invalid && forgotPasswordForm.touched) {
      <p class="form-message">Unesi validan email.</p>
      }

      @if (successMessage()) {
      <p class="form-message success">{{ successMessage() }}</p>
      }

      @if (errorMessage()) {
      <p class="form-message">{{ errorMessage() }}</p>
      }

      <button class="solid-action large" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Slanje...' : 'Posalji link' }}
      </button>
      <a class="auth-inline-link" routerLink="/login">Nazad na prijavu</a>
    </form>
  </section>
</div>
