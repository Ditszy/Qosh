<div class="auth-page">
  <section class="auth-view" aria-labelledby="reset-password-title">
    <p class="eyebrow">Nova lozinka</p>
    <h2 id="reset-password-title">Reset lozinke</h2>
    <form class="auth-form" [formGroup]="resetPasswordForm" (ngSubmit)="submit()">
      <label>
        Nova lozinka
        <input type="password" formControlName="newPassword" autocomplete="new-password" />
      </label>

      @if (resetPasswordForm.invalid && resetPasswordForm.touched) {
      <p class="form-message">Lozinka mora imati najmanje 6 karaktera.</p>
      }

      @if (successMessage()) {
      <p class="form-message success">{{ successMessage() }}</p>
      }

      @if (errorMessage()) {
      <p class="form-message">{{ errorMessage() }}</p>
      }

      <button class="solid-action large" type="submit" [disabled]="isSubmitting() || !token">
        {{ isSubmitting() ? 'Cuvanje...' : 'Sacuvaj lozinku' }}
      </button>
      <a class="auth-inline-link" routerLink="/login">Nazad na prijavu</a>
    </form>
  </section>
</div>
