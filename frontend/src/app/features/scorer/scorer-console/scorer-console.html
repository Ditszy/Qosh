<section aria-label="Scorer console">
  <h2>Zapisničar</h2>
  <p>Otvori dodeljeni meč i prati stanje pre nego što krenu kontrole za unos dogadjaja.</p>

  <label>
    ID meča
    <input type="text" [ngModel]="matchId()" (ngModelChange)="updateMatchId($event)" placeholder="UUID meča" />
  </label>

  @if (liveMatchLink(); as link) {
  <a [routerLink]="link">Otvori meč</a>
  } @else {
  <button type="button" disabled>Unesi ID meča</button>
  }
  <div>
    <button type="button" [disabled]="!liveMatchLink() || !!pendingAction()"
      (click)="controlClock('start')">Start</button>
    <button type="button" [disabled]="!liveMatchLink() || !!pendingAction()"
      (click)="controlClock('pause')">Pauza</button>
    <button type="button" [disabled]="!liveMatchLink() || !!pendingAction()"
      (click)="controlClock('resume')">Nastavi</button>
    <button type="button" [disabled]="!liveMatchLink() || !!pendingAction()" (click)="controlClock('end')">Kraj</button>
  </div>

  @if (pendingAction()) {
  <p>Slanje komande...</p>
  }
  @if (successMessage()) {
  <p>{{ successMessage() }}</p>
  }
  @if (errorMessage()) {
  <p>{{ errorMessage() }}</p>
  }
</section>
